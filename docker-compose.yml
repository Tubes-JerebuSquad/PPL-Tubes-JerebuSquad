services:
  app:
    build: .
    command: ["sh", "docker/entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rimbawatch
      POSTGRES_USER: rimbawatch
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rimbawatch -d rimbawatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendor:
  pgdata:
